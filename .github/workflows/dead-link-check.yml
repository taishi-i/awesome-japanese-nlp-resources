name: Dead link check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        id: links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check_dead_links.py --output report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or update the report issue
        if: steps.links.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Dead link report"
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
      - name: Close the report issue when all links work
        if: steps.links.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=$(gh issue list --state open --search 'in:title "Dead link report"' --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "All links resolved in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
